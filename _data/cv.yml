  sections:
    Selected Highlights:
      - bullet: "2026: Winner, AAMAS 2026 NS-Gym Competition on adaptive decision-making under non-stationarity."
      - bullet:
          "2026: Aletheia's Quest — 2nd place (SAIN Groningen) in the black-box track for LLM deception detection and recipient of the Scalability
          Award."
      - bullet: "2025–2026: Outstanding Reviewer, NLDL 2026; reviewer for the EIML Workshops at ICML 2026 and NeurIPS 2025."
      - bullet: "2025: Spotlight at the NeurIPS Mechanistic Interpretability Workshop for collaborative research conducted with Apart Research."
      - bullet: "2025: Published first-author work on Gaussian-process function approximation for reinforcement learning at NLDL 2025."
