cv:
  name: Matthijs van der Lende
  email: matthijs.vanderlende@gmail.com
  location: Groningen, Netherlands
  summary: "My research interests lie in understanding and improving how machine learning systems learn, adapt, and make decisions. I am particularly
    interested in continual learning, mechanistic interpretability, reinforcement learning, and probabilistic methods, and in how these areas
    interact in large generative models.

    "
  social_networks:
